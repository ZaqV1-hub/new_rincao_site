<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Painel Rincão pela Agenda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: painel do Rincão (menu lateral azul-marinho, conteúdo claro). Tudo parte da agenda: entra no dia e as abas mostram resumo, passeios, compras, bilheteria e fechamento. */
:root{
  --side:#133A62; --side-active:#24507C; --side-line:#2A4C72; --side-muted:#9DB4CF;
  --bg:#F4F7FB; --card:#FFFFFF; --line:#D9E3EE; --line2:#E8EEF5; --head:#EAF2FB; --field:#FFFFFF;
  --ink:#0F2D52; --text:#2E3F55; --muted:#6A7C92; --eyebrow:#4E6E92;
  --link:#2F6FB2; --primary:#133A62; --primary-ink:#FFFFFF; --accent:#E7B864;
  --ok:#1F7440; --ok-bg:#E3F4E9; --ok-line:#9FD3B2; --ok-solid:#2E8B4E;
  --run:#8A5A00; --run-bg:#FFF1CF; --run-line:#F2B33D;
  --free:#5C6F86; --free-bg:#E6ECF3;
  --danger:#B3362C; --danger-bg:#FCE7E5;
  --re:#9A4A12; --re-bg:#FCEADB;
  --c1:#133A62; --c2:#2F6FB2; --c3:#5FA8D3; --c4:#E0A43A; --c5:#9CB6D2;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side:#0D2440; --side-active:#1C3E63; --side-line:#1E3A5C;
    --bg:#0F1A28; --card:#16243A; --line:#28405E; --line2:#203550; --head:#1B2F4A; --field:#13203A;
    --ink:#EAF2FB; --text:#C9D6E4; --muted:#8FA3BB; --eyebrow:#8FB2D6;
    --link:#7DB5EC; --primary:#2F6FB2;
    --ok:#6FD39A; --ok-bg:#143225; --ok-line:#2F7D50; --ok-solid:#2F8F55;
    --run:#F2C766; --run-bg:#3A2E12; --run-line:#B98A22;
    --free:#9CB0C7; --free-bg:#1C2C42;
    --danger:#F2877C; --danger-bg:#3A1A18; --re:#F0A06E; --re-bg:#3A2316;
    --c1:#7DB5EC; --c2:#4C8FD1; --c3:#9CC9E8; --c4:#E8B45A; --c5:#33506F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --side:#0D2440; --side-active:#1C3E63; --side-line:#1E3A5C;
  --bg:#0F1A28; --card:#16243A; --line:#28405E; --line2:#203550; --head:#1B2F4A; --field:#13203A;
  --ink:#EAF2FB; --text:#C9D6E4; --muted:#8FA3BB; --eyebrow:#8FB2D6;
  --link:#7DB5EC; --primary:#2F6FB2;
  --ok:#6FD39A; --ok-bg:#143225; --ok-line:#2F7D50; --ok-solid:#2F8F55;
  --run:#F2C766; --run-bg:#3A2E12; --run-line:#B98A22;
  --free:#9CB0C7; --free-bg:#1C2C42;
  --danger:#F2877C; --danger-bg:#3A1A18; --re:#F0A06E; --re-bg:#3A2316;
  --c1:#7DB5EC; --c2:#4C8FD1; --c3:#9CC9E8; --c4:#E8B45A; --c5:#33506F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 26px;border-bottom:1px solid var(--side-line)}
.logo small{display:block;font-size:10px;font-weight:700;color:#F3D9A4;letter-spacing:.06em}
.logo b{display:block;font-size:30px;font-weight:800;color:#E7B864;text-shadow:2px 2px 0 #7A4B12;letter-spacing:.02em;line-height:1.1}
.logo i{display:block;font-style:normal;font-size:12px;font-weight:700;color:#E7B864}
.operator{margin:20px 14px 0;padding:0 10px 18px;border-bottom:1px solid var(--side-line)}
.operator .k{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--side-muted);text-transform:uppercase}
.operator .n{font-weight:700;font-size:14.5px;margin-top:4px;text-transform:uppercase}
.operator .r{font-size:13px;color:#D3DFEC}
.nav{list-style:none;margin:14px 0 0;padding:0 12px 20px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:6px;border-left:3px solid transparent;margin-bottom:3px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.active{background:var(--side-active);border-left-color:#8FB9E3}
.nav svg{width:19px;height:19px;flex:none;stroke:#C9D8E8;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .tag{margin-left:auto;font-size:10px;font-weight:700;background:#E7B864;color:#3A2606;border-radius:999px;padding:2px 8px}
.logout{margin:0 14px 18px;padding:12px;border-radius:6px;background:var(--side-active);border:1px solid var(--side-line);font-weight:600;text-align:center;font-size:14px}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:var(--card);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--card)}
.top h1{font-size:19px;font-weight:600}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2.2}
.menu-btn{display:none}
.top .right{margin-left:auto;font-size:13px;color:var(--muted)}
.content{flex:1;min-width:0;padding-top:22px;padding-bottom:120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* ---------- comuns ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.stack{display:grid;gap:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--eyebrow);text-transform:uppercase;margin-bottom:4px}
.h-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.title{font-size:24px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.h3{font-size:16.5px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--c5)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.green{background:var(--ok-solid);border-color:var(--ok-solid);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.link{border:0;background:none;padding:0;color:var(--link);text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{cursor:pointer}
.crumbs i{font-style:normal;color:var(--c5)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.p-run{background:var(--run-bg);color:var(--run);border-color:var(--run-line)}
.p-free{background:var(--free-bg);color:var(--free)}
.p-blue{background:var(--head);color:var(--link)}
.p-re{background:var(--re-bg);color:var(--re)}
.p-bad{background:var(--danger-bg);color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.notice{border-radius:8px;padding:12px 16px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--head)}
.notice.warn{background:var(--run-bg);border-color:var(--run-line);color:var(--ink)}
.notice.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ink)}
.notice .btn{margin-left:auto}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--head);text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.tot td{background:var(--head);font-weight:700;color:var(--ink)}
tr.grp td{background:color-mix(in srgb,var(--head) 50%,transparent);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--eyebrow);padding:8px 14px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--head)}
.lk{color:var(--link);font-weight:600;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
input.ck{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}

/* formulário: rótulo em cima, campo, ajuda embaixo */
.fs{background:var(--card);border:1px solid var(--line);border-radius:10px}
.fs-h{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fs-h p{margin:3px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}
.fs-b{padding:20px 22px;display:grid;gap:18px}
.grid{display:grid;gap:16px 18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span{font-size:13px;font-weight:600;color:var(--ink)}
.fld > small{font-size:12.5px;color:var(--muted)}
.in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;color:var(--ink);min-height:42px}
.in:hover{border-color:var(--c5)}
.in:focus{outline:2px solid var(--link);outline-offset:0;border-color:transparent}
.in[readonly]{background:var(--head);color:var(--muted)}
textarea.in{min-height:84px;resize:vertical}
.affix{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.affix b{display:grid;place-items:center;padding:0 12px;background:var(--head);color:var(--muted);font-weight:600;font-size:13.5px;border-right:1px solid var(--line)}
.affix .in{border:0;border-radius:0}
.span2{grid-column:span 2}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--card)}
.opt:has(input:checked){border-color:var(--link);background:var(--head)}
.opt input{margin-top:3px;width:17px;height:17px;accent-color:var(--primary);flex:none}
.opt b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.segs button{border:0;background:transparent;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.segs button:last-child{border-right:0}
.segs button.on{background:var(--primary);color:#fff;font-weight:600}
.savebar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(15,45,82,.08);margin-bottom:calc(env(safe-area-inset-bottom,0px))}
.savebar .btns{margin-left:auto}
.err{font-size:13px;color:var(--danger)}

/* ---------- agenda ---------- */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:18px 0 14px}
.monthnav{display:inline-flex;align-items:center;gap:10px}
.monthnav b{font-size:17px;color:var(--ink);min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);padding-bottom:4px}
.day{border:1px dashed var(--line);background:transparent;border-radius:9px;padding:8px 10px 9px;min-height:118px;text-align:left;font:inherit;color:var(--muted);display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden}
.day .n{font-size:13.5px;font-weight:600;color:var(--c5);display:flex;justify-content:space-between;align-items:center}
.day.blank{border:0;min-height:0}
.day.free{cursor:pointer}
.day.free .plus{margin-top:auto;font-size:12px;font-weight:600;color:var(--link);opacity:0}
.day.free:hover{border-color:var(--link);background:var(--card)}
.day.free:hover .plus,.day.free:focus-visible .plus{opacity:1}
.day.grp{border:1px solid var(--line);background:var(--card);cursor:pointer}
.day.du{border:2px solid var(--link);background:var(--head);cursor:pointer}
.day.grp:hover,.day.du:hover{box-shadow:0 4px 14px rgba(19,58,98,.14)}
.day .n b{color:var(--ink);font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .ppl{font-size:22px;font-weight:800;color:var(--ink);line-height:1.05;margin-top:2px}
.day .ppl em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.day .s{font-size:11.5px;color:var(--muted);line-height:1.35}
.day .tags{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap;padding-top:5px}
.t{font-size:9.5px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
.t.du{background:var(--link);color:#fff}
.t.ok{background:var(--ok-bg);color:var(--ok)}
.t.run{background:var(--run-bg);color:var(--run)}
.t.hj{background:var(--accent);color:#3A2606}
.caleg{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:13px;color:var(--muted)}
.caleg span{display:inline-flex;align-items:center;gap:8px}
.caleg i{width:14px;height:14px;border-radius:4px}

/* ---------- dia ---------- */
.dayhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.daynav{display:flex;gap:6px}
.dayhead .tt{flex:1;min-width:220px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:11px 16px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--primary)}
.tabs .cnt{font-size:11px;background:var(--head);color:var(--link);border-radius:999px;padding:1px 7px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.kpi.hi{background:var(--head)}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.15em;color:var(--eyebrow);text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.two > *{min-width:0}
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:160px 1fr 96px;gap:12px;align-items:center;font-size:13.5px}
.hb .tr{height:12px;background:var(--head);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:3px}
.hb b{text-align:right;color:var(--ink);font-weight:600}
.prog{height:8px;border-radius:99px;background:var(--free-bg);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.pcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;cursor:pointer;text-align:left;width:100%}
.pcard:hover{border-color:var(--c5);box-shadow:0 4px 14px rgba(19,58,98,.08)}
.pcard h3{font-size:16.5px}
.pcard .meta{font-size:13px;color:var(--muted);margin-top:2px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.vc{font-size:12px;font-weight:600;border-radius:7px;padding:5px 9px;border:1px solid var(--line);background:var(--free-bg);color:var(--free);display:inline-flex;gap:6px;align-items:center}
.vc.run{background:var(--run-bg);color:var(--run);border-color:var(--run-line)}
.vc.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.pcard .side-num{text-align:right}
.pcard .side-num b{display:block;font-size:24px;color:var(--ink);font-weight:800}
.pcard .side-num small{font-size:12px;color:var(--muted)}
.calc{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calc .ln{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14.5px}
.calc .ln span{color:var(--text)}
.calc .ln small{display:block;color:var(--muted);font-size:12.5px}
.calc .ln b{color:var(--ink);font-weight:600;white-space:nowrap}
.calc .ln.minus b{color:var(--ok)}
.calc .ln.big{background:var(--head);border-bottom:0}
.calc .ln.big span{font-weight:700;color:var(--ink)}
.calc .ln.big b{font-size:24px;font-weight:800}
.plist{max-height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.plist label{display:flex;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.plist label:last-child{border-bottom:0}
.plist label span{flex:1}
.plist label small{color:var(--muted);font-size:12.5px}

/* bilheteria */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px;position:relative}
.prod:hover{border-color:var(--link);background:var(--head)}
.prod:disabled{opacity:.45;cursor:not-allowed;background:var(--card)}
.prod b{color:var(--ink);font-size:14.5px;font-weight:600}
.prod span{font-size:13px;color:var(--muted)}
.prod .pr{margin-top:auto;font-weight:700;color:var(--ink);font-size:15px}
.prod .q{position:absolute;top:10px;right:10px;background:var(--primary);color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:24px;height:24px;display:grid;place-items:center;padding:0 7px}
.cart{position:sticky;top:80px}

.qty{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}

.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}

.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.paygrid button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;font-weight:600;cursor:pointer;color:var(--ink)}
.paygrid button.on{border-color:var(--link);background:var(--head);color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(11,31,54,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:24px 26px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(11,31,54,.3)}
.modal h3{font-size:19px;font-weight:600;margin-bottom:6px}

.recibo .rh b{font-size:16px;color:var(--ink)}
.recibo .rl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.recibo .rl span{color:var(--muted)}
.recibo .rl b{color:var(--ink);text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ok-solid);color:#fff;padding:12px 18px;border-radius:8px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* responsivo */
@media (max-width:1250px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  body.menu-open .side{transform:none}
  .menu-btn{display:grid}
}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.pos{grid-template-columns:1fr}.cart{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){

  .cal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dow,.day.blank,.day.past0{display:none}
  .day{min-height:0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .hb{grid-template-columns:110px 1fr 80px}
  .top .right{display:none}
}

/* ---------- compra ---------- */
.ctop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;padding:16px 0 4px;border-top:1px solid var(--line2);margin-top:16px}
.ctop dt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow)}
.ctop dd{margin:3px 0 0;color:var(--ink);font-weight:500}
.vst-ok{color:var(--ok);font-weight:700}
.vst-us{color:var(--muted);font-weight:700}
tr.used td{background:color-mix(in srgb,var(--free-bg) 60%,transparent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between}
.wa{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.wa .in{width:200px}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--head)}
tbody tr.row:hover .go{opacity:1}
.go{opacity:0;color:var(--link);font-weight:600;font-size:13px;white-space:nowrap}
@media (hover:none){.go{opacity:1}}

/* ---------- caixas ---------- */
.cxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cxcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:18px;display:flex;flex-direction:column;gap:12px}
.cxcard.open{border-color:var(--ok-line);box-shadow:inset 4px 0 0 var(--ok-solid)}
.cxcard h3{font-size:17px}
.cxcard .meta{font-size:13px;color:var(--muted)}
.cxnums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cxnums div{background:var(--head);border-radius:8px;padding:10px 12px}
.cxnums small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow);font-weight:700}
.cxnums b{font-size:18px;color:var(--ink)}
.cxhead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.subtabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;cursor:pointer}
.subtabs button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.subtabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px dashed var(--c5);background:transparent;color:var(--link);font-weight:600;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer}
.quick button:hover{background:var(--head);border-style:solid}
.quick button:disabled{opacity:.4;cursor:not-allowed}
.line{border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--head) 45%,var(--card));padding:14px 16px;display:grid;gap:12px}
.line .lg{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1.2fr);gap:12px;align-items:end}
.line .lg.it{grid-template-columns:minmax(0,1.6fr) auto}
.line .lf{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px}
.line .lf small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow);font-weight:700}
.line .lf b{font-size:17px;color:var(--ink)}
.line .lf .rm{margin-left:auto}
.qty.big button{width:40px;height:42px;font-size:18px}
.qty.big span{min-width:46px;font-size:16px}
.qty.big .mn{background:var(--danger-bg);color:var(--danger)}
.qty.big .pl{background:var(--primary);color:#fff}
.empty-line{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}
.sumline span{color:var(--muted)}
.sumline b{color:var(--ink);font-weight:600;text-align:right}
.payrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center;margin-bottom:8px}
.payrow .x{border:0;background:none;color:var(--danger);font-weight:700;cursor:pointer;font-size:18px}
.paystat{border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin:8px 0 12px}
.paystat.falta{background:var(--run-bg);color:var(--run)}
.paystat.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- resultado do dia ---------- */
.result{background:var(--primary);color:#fff;border-radius:12px;padding:22px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.result small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#BFD2E6}
.result b{display:block;font-size:26px;font-weight:800;margin-top:4px;color:#fff}
.result span{display:block;font-size:12.5px;color:#BFD2E6;margin-top:2px}
.result .main b{font-size:34px;color:#F3D9A4}
@media (max-width:1100px){.result{grid-template-columns:1fr 1fr}.ctop{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.line .lg,.line .lg.it{grid-template-columns:1fr}.cxnums{grid-template-columns:1fr 1fr}}

/* ---------- venda: escolha por cartões ---------- */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 14px 12px;cursor:pointer;min-height:92px;transition:border-color .15s,box-shadow .15s,transform .1s}
.ptile:hover{border-color:var(--link);box-shadow:0 6px 16px rgba(19,58,98,.12)}

.ptile .pn{font-weight:600;color:var(--ink);font-size:15px;padding-right:30px}
.ptile .pd{font-size:12.5px;color:var(--muted)}

.ptile .pplus,.ptile .pq{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.ptile .pplus{background:var(--head);color:var(--link);font-size:17px}
.ptile .pq{background:var(--primary);color:#fff}

@media (prefers-reduced-motion:reduce){.ptile{transition:none}}
.vrows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto 110px 36px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);background:var(--card)}

.vrow:last-child{border-bottom:0}

.vrow .r{text-align:right}
.vname b{display:block;color:var(--ink);font-weight:600}
.vname small{color:var(--muted);font-size:12.5px}
.vname s{opacity:.7}
.vsub{color:var(--ink);font-size:15px}
.rmx{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--danger);font-size:18px;font-weight:700;cursor:pointer}
.rmx:hover{background:var(--danger-bg)}
.req{font-size:11px;font-weight:600;color:var(--danger);background:var(--danger-bg);border-radius:999px;padding:1px 8px;margin-left:4px}
@media (max-width:760px){
  .vrow,.vrow.it{grid-template-columns:1fr auto;}
  .vrow.vhead{display:none}

}

/* ---------- folha para exportar (sempre papel branco) ---------- */
:root{--paper:#FFFFFF;--paper-ink:#0F2D52;--paper-text:#2E3F55;--paper-muted:#6A7C92;--paper-line:#D9E3EE;--paper-head:#EAF2FB;--paper-desk:#DDE5EF}

.paper{background:var(--paper);color:var(--paper-text);width:100%;max-width:794px;margin:0 auto;padding:40px 44px;box-shadow:0 10px 30px rgba(11,31,54,.18);font-size:13px;color-scheme:light}

.phead .pr span{display:block;color:var(--paper-muted);font-size:12px}
.pkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.pkpis div{border:1px solid var(--paper-line);border-radius:6px;padding:10px 12px}
.pkpis small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--paper-muted)}
.pkpis b{display:block;font-size:18px;color:var(--paper-ink);margin-top:3px;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pgrid > *{min-width:0}
.pbars{display:grid;gap:8px}
.pb{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center}
.pb span{color:var(--paper-text)}

.pb .pt i{display:block;height:100%}

.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
.ptab th{background:var(--paper-head);color:var(--paper-ink);text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-bottom:1px solid var(--paper-line)}
.ptab td{padding:7px 9px;border-bottom:1px solid var(--paper-line);color:var(--paper-text);font-variant-numeric:tabular-nums}
.ptab .r{text-align:right}
.ptab tr.pf td{font-weight:700;color:var(--paper-ink);background:var(--paper-head)}
.pnote{color:var(--paper-muted)}
.psign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px}
.psign div{border-top:1px solid var(--paper-ink);padding-top:6px;text-align:center;color:var(--paper-muted);font-size:12px}
@media (max-width:760px){.paper{padding:24px 18px}.pkpis{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr}.pb{grid-template-columns:100px 1fr auto}}

.brand-img{width:190px;max-width:100%;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}

.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cats div{background:var(--head);border-radius:8px;padding:8px 10px}
.cats small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--eyebrow)}
.cats b{font-size:18px;color:var(--ink)}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.respbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:14px}

.respbox b{color:var(--ink);font-size:15px}
.sigbox{text-align:center;color:var(--ink);background:#fff;border-radius:8px;padding:8px;border:1px solid var(--line2)}
.sigbox small{display:block;font-size:11.5px;color:#6A7C92;border-top:1px solid #D9E3EE;padding-top:4px;margin-top:2px}
.sigv{width:100%;height:70px;display:block;color:#0F2D52}
@media (max-width:560px){.respbox{grid-template-columns:1fr}}
.calc .ln.vline2{align-items:center}

.tgrp{border:1px solid var(--line);border-radius:10px;padding:4px 14px 8px}
.tgh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line2);margin-bottom:2px}
.tgh b{color:var(--ink);font-size:15px}
.tgh span{font-size:12.5px;color:var(--muted);font-weight:600}
.prow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .pnm{flex:1;min-width:0}
.prow b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.prow small{display:block;color:var(--muted);font-size:12px}

.result.r5{grid-template-columns:1.35fr repeat(4,minmax(0,1fr))}
.result.r5 b{font-size:22px;white-space:nowrap}
.result.r5 .main b{font-size:28px}
@media (max-width:1100px){.result.r5{grid-template-columns:1fr 1fr}}
.cxbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.cxbar.open{border-color:var(--ok-line,var(--ok));background:var(--ok-bg)}
.cxbar b{display:block;color:var(--ink);font-size:16px}
.cxbar span{font-size:13px;color:var(--muted)}
.scrollhint{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:-4px}
.tw.wide table.vt{min-width:1180px}
.vt .stk{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line2)}
.vt tr.tot .stk{background:var(--head)}
.vt th.cat,.vt td.cat{background:color-mix(in srgb,var(--head) 55%,transparent)}
.modgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.modc{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.modc>b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:4px}
.modc .ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13.5px;border-top:1px solid var(--line2)}
.modc .ln small{display:block;font-size:12px;color:var(--muted)}
.modc em,.calc em{font-style:normal;font-size:12px;color:var(--muted)}
.modc .ln b{color:var(--ink)}
@media (max-width:1000px){.modgrid{grid-template-columns:1fr 1fr}}
.restr2{background:var(--run-bg);border:1px solid var(--run-line);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink);display:grid;gap:3px}
.restr2 b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--run)}
.slist{border:1px solid var(--line);border-radius:10px;padding:2px 14px;max-height:420px;overflow:auto}
.slist .prow{cursor:default}
.slist .pv{min-width:92px;text-align:right;color:var(--ink)}
.slist .prow.rb .pnm b{text-decoration:line-through;color:var(--muted)}
.rbtag{color:var(--danger);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.fcard small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--eyebrow)}
.fcard span{font-size:12px;color:var(--muted)}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
.rbbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.rbsearch{position:relative}
.rbres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,30,60,.18);z-index:20;max-height:300px;overflow:auto;padding:4px}
.rbres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text)}
.rbres button:hover,.rbres button:focus{background:var(--head)}
.rbres b{display:block;color:var(--ink);font-weight:600}
.rbres span{font-size:12.5px;color:var(--muted)}
.rbnone{padding:10px 12px;font-size:13px;color:var(--muted)}
.calc .ln.grp2{background:var(--head);padding:6px 16px}
.calc .ln.grp2 span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--eyebrow)}
.modal.wide{max-width:760px}
.vias{display:grid;gap:4px}
.corte{text-align:center;font-size:12px;color:var(--muted);border-top:1px dashed var(--c5);padding-top:6px;margin-top:10px}
.recibo .rsec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--eyebrow);margin:10px 0 2px}
.rsig{display:flex;gap:24px;margin-top:34px}
.rsig div{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--muted);text-align:center}
.pkpis.p5{grid-template-columns:repeat(5,minmax(0,1fr))}

.vt2 .vexp{width:34px;height:34px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:inline-grid;place-items:center}
.vt2 .vexp:hover{background:var(--head)}
.vt2 .vexp .chev{margin:0 0 4px!important;transform:rotate(45deg)!important}
.vt2 .vexp[aria-expanded="true"] .chev{transform:rotate(-135deg)!important;margin:4px 0 0!important}
.vt2 tr.vopen td{background:var(--head)}
.vt2 tr.vdrow td{background:var(--head);padding-top:4px}
.vdgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.vdgrid .modc{background:var(--card)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){.vdgrid{grid-template-columns:1fr 1fr}}

  var k=S.date,d=dd(k),list=CX.filter(function(x){return x.date===k});
  var h='<div class="h-row" style="margin-bottom:14px"><p class="hint" style="margin:0;max-width:70ch">Todo caixa é aberto e fechado. Um caixa aberto fecha sozinho à meia-noite. Mais de uma pessoa pode usar o mesmo caixa aberto. Em todos dá para vender ingressos, serviços adicionais.</p>'+(d.fech.st==='fechado'||past(k)?'':'<button class="btn pri" id="abrirCx">'+ICON.cx+'Abrir caixa</button>')+'</div>';
  if(!list.length&&!PCX[k])return h+'<div class="empty-line">Nenhum caixa aberto nesta data.'+(k>=HOJE?' Abra um caixa e escolha o local para começar a vender.':'')+'</div>';
  h+='<div class="cxlist">';
  if(PCX[k]){var pr=pcxCalc(k),po=PCX[k].st==='aberto';h+='<div class="cxcard'+(po?' open':'')+'"><div class="h-row"><div><h3>Passeios</h3><div class="meta">Aberto por '+esc(PCX[k].por)+' às '+PCX[k].ab+'</div></div>'+(po?'<span class="pill p-ok"><span class="dot"></span>Aberto</span>':'<span class="pill p-free">Fechado</span>')+'</div><div class="cxnums"><div><small>Recebido das escolas</small><b class="num">'+brl(pr.cob)+'</b></div><div><small>Dinheiro no caixa</small><b class="num">'+brl(pr.esperado)+'</b></div><div><small>Passeios finalizados</small><b class="num">'+pr.q+'</b></div><div><small>Despesas</small><b class="num">'+brl(pr.desp)+'</b></div></div><button class="btn'+(po?' pri':'')+'" data-tab="passeios" style="justify-content:center">Ir para o caixa de passeios</button></div>'}
  list.forEach(function(x){var r=cxCalc(x),open=x.st==='aberto';
    h+='<div class="cxcard'+(open?' open':'')+'"><div class="h-row"><div><h3>'+esc(x.local)+'</h3><div class="meta">Aberto por '+esc(x.por)+' às '+x.ab+(open?'':' · fechado '+esc(x.fech))+'</div></div>'+(open?'<span class="pill p-ok"><span class="dot"></span>Aberto</span>':'<span class="pill p-free">Fechado</span>')+'</div>';
    h+='<div class="cxnums"><div><small>Vendas</small><b class="num">'+brl(r.fat)+'</b></div><div><small>Dinheiro no caixa</small><b class="num">'+brl(r.esperado)+'</b></div><div><small>Público vendido</small><b class="num">'+r.pub+'</b></div><div><small>Ingressos lidos</small><b class="num">'+r.valQ+'</b></div></div>';
    h+='<button class="btn '+(open?'pri':'')+'" data-cx="'+x.id+'" style="justify-content:center">'+(open?'Entrar no caixa':'Ver fechamento do caixa')+'</button></div>';
  });
  return h+'</div>';
}

  else{
    h+='<div class="tw"><table><thead><tr><th style="width:36px"><input type="checkbox" class="ck" id="vAll" aria-label="Selecionar todos"'+(nsel===vs.length?' checked':'')+'></th><th>ID</th><th>Voucher</th><th>Data da visita</th><th>Ingresso</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>';
    vs.forEach(function(v){h+='<tr class="'+(v.usado?'used':'')+'"><td><input type="checkbox" class="ck" data-vs="'+v.id+'"'+(S.vsel[v.id]?' checked':'')+' aria-label="Selecionar voucher '+v.code+'"></td><td class="num">'+v.id+'</td><td><b style="color:var(--ink);letter-spacing:.06em">'+v.code+'</b></td><td>'+fmtY(k)+'</td><td>'+esc(v.tipo)+'</td><td class="r num">'+brl(v.valor)+'</td><td>'+(v.usado?'<span class="vst-us">USADO</span><div class="muted" style="font-size:12.5px">'+esc(v.em)+(v.cx?' · '+esc(cxNome(v.cx)):'')+'</div>':'<span class="vst-ok">NÃO USADO</span>')+'</td></tr>'});
    h+='</tbody></table></div><div class="actions"><div class="btns"><button class="btn pri" id="vVal"'+(nsel?'':' disabled')+'>Validar selecionados</button><button class="btn" id="vDes"'+(nsel?'':' disabled')+'>Desvalidar selecionados</button><button class="btn" id="vImp"'+(nsel?'':' disabled')+'>Imprimir selecionados</button></div><div class="wa"><input class="in" id="waTel" placeholder="Telefone com DDD" aria-label="Telefone com DDD"><button class="btn green" id="vWa"'+(nsel?'':' disabled')+'>Enviar selecionados no WhatsApp</button></div></div>';
  }

  h+='<div class="two"><div class="fs"><div class="fs-h"><div><h3 class="h3">Itens da compra</h3></div></div><div class="fs-b"><div class="calc">';
  if(c.esc)h+='<div class="ln"><span>Ingresso escolar · '+esc(pas.cli)+'</span><b class="num">'+brl(valor(c))+'</b></div>';
  IORD.forEach(function(a){if(c.ing[a])h+='<div class="ln"><span>'+c.ing[a]+'× '+ING[a].n+'</span><b class="num">'+brl(c.ing[a]*precoIng(a,c.orig,c.tab))+'</b></div>'});

  if(c.desc)h+='<div class="ln minus"><span>Descontos'+(c.cortQ?'<small>'+plural(c.cortQ,'cortesia','cortesias')+' autorizada por '+esc(c.aut)+'</small>':'')+'</span><b class="num">− '+brl(c.desc)+'</b></div>';
  h+='<div class="ln big"><span>Total</span><b class="num">'+brl(valor(c))+'</b></div></div><h4 style="font-size:14px;margin:4px 0 0">Pagamento</h4><div class="calc">'+c.pags.map(function(p){return '<div class="ln"><span>'+esc(p.f)+'</span><b class="num">'+brl(p.v)+'</b></div>'}).join('')+'</div></div></div>';

  return h;

function caixaPage(){
  var x=cxById(S.cxid),r=cxCalc(x),open=x.st==='aberto';
  S.date=x.date;
  var h=crumbsDia('<i>/</i><a data-tab-go="caixas">Caixas</a><i>/</i><span>'+esc(x.local)+'</span>');
  h+='<div class="card"><div class="cxhead"><div><div class="eyebrow">Caixa · '+fmtY(x.date)+'</div><div class="title">'+esc(x.local)+'</div><p class="sub">Aberto por '+esc(x.por)+' às '+x.ab+'. '+(open?'Fecha sozinho à meia-noite se ninguém fechar antes.':'Fechado '+esc(x.fech)+'.')+'</p></div><div class="btns">'+(open?'<span class="pill p-ok"><span class="dot"></span>Aberto</span>':'<span class="pill p-free">Fechado</span>')+'<span class="pill p-blue num">Vendas '+brl(r.fat)+'</span><span class="pill p-blue num">Dinheiro '+brl(r.esperado)+'</span></div></div>';
  var tabs=[['vender','Vender',ICON.tk],['consultar','Consultar ingresso',ICON.srch],['fundo','Fundo e sangria',ICON.cash],['fechamento','Fechamento do caixa',ICON.doc]];
  if(!open&&S.cxtab==='vender')S.cxtab='fechamento';
  h+='<div class="subtabs">'+tabs.map(function(t){return '<button data-cxtab="'+t[0]+'" class="'+(S.cxtab===t[0]?'on':'')+'"'+(!open&&t[0]==='vender'?' disabled style="opacity:.45"':'')+'>'+t[2]+t[1]+'</button>'}).join('')+'</div>';
  h+=({vender:cxVender,consultar:cxConsultar,fundo:cxFundo,fechamento:cxFechamento}[S.cxtab])(x,r)+'</div>';
  return h;
}
function vendaTotais(v){
  var sub=0,desc=0,cq=0;
  v.ings.forEach(function(l){var u=bilP(l.k),dp=DESCS[l.d].p;sub+=u*l.q;desc+=u*dp*l.q;if(l.d==='cort'||l.d==='aniv')cq+=l.q});
  v.its.forEach(function(l){sub+=itemP(l.k)*l.q});
  var tot=Math.round((sub-desc)*100)/100;
  var pago=v.pags.reduce(function(a,p,i){return a+(p.v==null?(v.pags.length===1?tot:0):p.v)},0);
  return{sub:sub,desc:desc,tot:tot,cq:cq,pago:pago};
}
function cpfFmt(s){var d=String(s||'').replace(/\D/g,'').slice(0,11);if(d.length>9)return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9);if(d.length>6)return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);if(d.length>3)return d.slice(0,3)+'.'+d.slice(3);return d}
function cpfOk(s){return String(s||'').replace(/\D/g,'').length===11}
function podeFinalizar(){var v=S.venda,t=vendaTotais(v),falta=Math.round((t.tot-t.pago)*100)/100,din=v.pags.some(function(p){return p.f==='Dinheiro'});
  if(!v.ings.length&&!v.its.length)return false;if(!cpfOk(v.cpf))return false;if(t.cq&&!v.aut.trim())return false;
  if(t.tot===0)return true;return falta<=0.004&&(falta>-0.004||din)}
function cxVender(x){
  var v=S.venda||(S.venda=novaVenda()),d=dd(x.date),t=vendaTotais(v),noDu=!d.du;
  function qtdNa(k,arr){return arr.filter(function(l){return l.k===k}).reduce(function(a,l){return a+l.q},0)}
  function tile(attr,k,n,dsc,pr,q,dis){return '<button class="ptile" '+attr+'="'+k+'"'+(dis?' disabled':'')+'><span class="pn">'+esc(n)+'</span><span class="pd">'+esc(dsc)+'</span><span class="pp num">'+brl(pr)+'</span>'+(q?'<span class="pq num">'+q+'</span>':'<span class="pplus" aria-hidden="true">+</span>')+'</button>'}
  var h='<div class="pos"><div class="stack">';
  h+='<div class="fs"><div class="fs-h"><div><h3 class="h3">Ingressos</h3><p>'+(noDu?'Esta data não tem day use aberto. Abra o day use para vender ingressos.':'Toque no ingresso para adicionar. Depois escolha o desconto de cada linha.')+'</p></div></div><div class="fs-b">';
  h+='<div class="ptiles">'+IORD.map(function(k){return tile('data-qi',k,ING[k].n,ING[k].d,bilP(k),qtdNa(k,v.ings),noDu)}).join('')+'</div>';
  if(v.ings.length){h+='<div class="vrows"><div class="vrow vhead"><span>Ingresso</span><span>Desconto por ingresso</span><span>Quantidade</span><span class="r">Subtotal</span><span></span></div>';
    v.ings.forEach(function(l,i){var u=bilP(l.k),un=u*(1-DESCS[l.d].p);
      h+='<div class="vrow"><div class="vname"><b>'+ING[l.k].n+'</b><small class="num">'+(l.d==='sem'?brl(u)+' cada':'<s>'+brl(u)+'</s> '+brl(un)+' cada')+'</small></div><select class="in" data-li="'+i+'" data-f="d" aria-label="Desconto do '+ING[l.k].n+'">'+DORD.map(function(k){return '<option value="'+k+'"'+(k===l.d?' selected':'')+'>'+DESCS[k].n+'</option>'}).join('')+'</select><div class="qty big"><button class="mn" data-lq="i:'+i+'" data-dq="-1" aria-label="Menos">−</button><span class="num">'+l.q+'</span><button class="pl" data-lq="i:'+i+'" data-dq="1" aria-label="Mais">+</button></div><b class="r num vsub">'+brl(un*l.q)+'</b><button class="rmx" data-rm="i:'+i+'" aria-label="Remover linha">×</button></div>'});
    h+='</div><p class="hint" style="margin:0">Dois adultos, um inteiro e um meia? Mude o desconto desta linha e toque de novo em Adulto: entra uma linha nova sem desconto.</p>'}
  h+='</div></div>';
  h+='<div class="fs"><div class="fs-h"><div><h3 class="h3">Serviços adicionais</h3><p>Sem desconto. Vêm do cadastro de Serviços.</p></div></div><div class="fs-b">';
  var svs=(d.du?d.du.it:SORD).filter(function(k){return SERV[k]&&SERV[k].on});h+=svs.length?'<div class="ptiles">'+svs.map(function(k){return tile('data-qt',k,SERV[k].n,SERV[k].d,SERV[k].bil,qtdNa(k,v.its))}).join('')+'</div>':'<p class="muted" style="margin:0">Nenhum serviço à venda nesta data.</p>';
  if(v.its.length){h+='<div class="vrows"><div class="vrow vhead it"><span>Item</span><span>Quantidade</span><span class="r">Subtotal</span><span></span></div>';
    v.its.forEach(function(l,i){h+='<div class="vrow it"><div class="vname"><b>'+itemN(l.k)+'</b><small class="num">Serviço · '+brl(itemP(l.k))+' cada</small></div><div class="qty big"><button class="mn" data-lq="t:'+i+'" data-dq="-1" aria-label="Menos">−</button><span class="num">'+l.q+'</span><button class="pl" data-lq="t:'+i+'" data-dq="1" aria-label="Mais">+</button></div><b class="r num vsub">'+brl(itemP(l.k)*l.q)+'</b><button class="rmx" data-rm="t:'+i+'" aria-label="Remover linha">×</button></div>'});
    h+='</div>'}
  h+='</div></div></div>';
  var falta=Math.round((t.tot-t.pago)*100)/100,din=v.pags.some(function(p){return p.f==='Dinheiro'});
  h+='<div class="fs cart"><div class="fs-h"><div><div class="eyebrow">Resumo · '+esc(x.local)+'</div><h3 class="h3 num" style="font-size:20px">'+fmtY(x.date)+'</h3></div></div><div class="fs-b" style="gap:4px">';
  h+='<label class="fld" style="margin-bottom:8px"><span>CPF do cliente <span class="req">obrigatório</span></span><input class="in num" id="vCpf" inputmode="numeric" value="'+esc(v.cpf)+'" placeholder="000.000.000-00" autocomplete="off"><small>Para achar a compra depois em Consultar ingresso</small></label>';
  if(!v.ings.length&&!v.its.length)h+='<p class="muted" style="margin:0 0 6px">Nenhum item na venda ainda.</p>';
  v.ings.forEach(function(l){var un=bilP(l.k)*(1-DESCS[l.d].p);h+='<div class="sumline"><span>'+l.q+'× '+ING[l.k].n+(l.d!=='sem'?' · '+DESCS[l.d].n.split(' (')[0].toLowerCase():'')+'</span><b class="num">'+brl(un*l.q)+'</b></div>'});
  v.its.forEach(function(l){h+='<div class="sumline"><span>'+l.q+'× '+itemN(l.k)+'</span><b class="num">'+brl(itemP(l.k)*l.q)+'</b></div>'});

  if(t.cq)h+='<label class="fld" style="margin-bottom:10px"><span>Cortesia autorizada por <span class="req">obrigatório</span></span><input class="in" id="vAut" value="'+esc(v.aut)+'" placeholder="Nome de quem autorizou"></label>';
  h+='<div class="eyebrow" style="margin:4px 0 8px">Pagamento</div>';
  v.pags.forEach(function(p,i){h+='<div class="payrow"><select class="in" data-pf="'+i+'" aria-label="Forma de pagamento">'+PAGS.map(function(f){return '<option'+(f===p.f?' selected':'')+'>'+f+'</option>'}).join('')+'</select><div class="affix"><b>R$</b><input class="in num" data-pv="'+i+'" inputmode="decimal" value="'+(p.v==null?(v.pags.length===1?m2(t.tot):''):m2(p.v))+'" aria-label="Valor"></div>'+(v.pags.length>1?'<button class="x" data-px="'+i+'" aria-label="Remover forma">×</button>':'<span></span>')+'</div>'});

  h+='<button class="btn green" id="finVenda" style="justify-content:center;width:100%;padding:14px;font-size:15px;margin-top:6px"'+(podeFinalizar()?'':' disabled')+'>Finalizar compra</button><p class="hint" id="finHint" style="text-align:center">'+(cpfOk(v.cpf)?'':'Informe o CPF do cliente para finalizar.')+'</p></div></div></div>';
  return h;
}

function cxConsultar(x){

function firstCode(k){var c=comprasDe(k).filter(function(c){return c.orig==='site'})[0];if(!c)return '';var v=vouchers(c).filter(function(v){return !v.usado})[0];return v?v.code:''}
function cxFundo(x,r){

function sec(key,title,sum,body,pill){var o=!!(S.popen&&S.popen[key]);return '<details class="fs fsd" data-sec="'+key+'"'+(o?' open':'')+'><summary class="fs-h"><div><h3 class="h3">'+title+'</h3><p>'+sum+'</p></div><span class="sumr">'+(pill||'')+'<span class="chev" aria-hidden="true"></span></span></summary><div class="fs-b">'+body+'</div></details>'}
var FPAGS=['Pix','Transferência','Boleto','Cartão','Dinheiro'];
function fpTot(){return (S.fpags||[]).reduce(function(a,x){return a+(x.v||0)},0)}
function fpEff(cob){var fp=S.fpags,nl=fp.filter(function(x){return x.v==null}).length,rest=Math.max(0,Math.round((cob-fpTot())*100)/100);return fp.map(function(x){return{f:x.f,v:x.v==null?(nl===1?rest:0):x.v,auto:x.v==null&&nl===1}})}
/* ================= LOCAIS DE CAIXA ================= */

  return h;
}
function locModal(i){var l=i==null?{n:'',d:''}:LOC[i];S.loci=i;
  openModal('<h3>'+(i==null?'Novo local de caixa':'Editar local')+'</h3><p>Aparece na lista ao abrir um caixa.</p><div class="grid" style="margin-top:14px"><label class="fld"><span>Nome <span class="req">obrigatório</span></span><input class="in" id="locN" value="'+esc(l.n)+'" placeholder="Ex.: Lanchonete"></label><label class="fld"><span>Descrição</span><input class="in" id="locD" value="'+esc(l.d)+'" placeholder="Ex.: Ao lado da piscina de ondas"></label></div><span class="err" id="locErr" hidden></span><div class="btns"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="locOk">'+(i==null?'Criar local':'Salvar')+'</button></div>');
}

/* ---------- aba Passeios: caixa só para passeios ---------- */
function tPasseios(){
  var k=S.date,d=dd(k),x=PCX[k],r=pcxCalc(k),fechD=d.fech.st==='fechado',pode=!fechD;
  var h='<div class="stack">';
  h+='<div class="result"><div class="main"><small>Resultado dos passeios</small><b class="num">'+brl(r.resultado)+'</b><span>receita menos despesas dos passeios</span></div><div><small>Receita</small><b class="num">'+brl(r.rec)+'</b><span>'+r.q+' de '+d.pas.length+' passeios finalizados</span></div><div><small>Despesas</small><b class="num">'+brl(r.desp)+'</b><span>'+plural(x?x.desp.length:0,'lançamento','lançamentos')+'</span></div><div><small>Dinheiro em caixa</small><b class="num">'+brl(r.esperado)+'</b><span>troco + dinheiro recebido − saídas</span></div></div>';
  // situação do caixa
  if(!x){h+='<div class="notice"><span><b>Caixa de passeios fechado.</b> Abra para receber das escolas em dinheiro, lançar despesas dos passeios e fazer sangrias. Pix, transferência e boleto podem ser registrados mesmo assim.</span>'+(pode?'<button class="btn pri" id="pxAbrir">'+ICON.cx+'Abrir caixa de passeios</button>':'')+'</div>'}
  else{var dif=x.contado==null?null:x.contado-r.esperado;
    h+='<div class="cxbar'+(x.st==='aberto'?' open':'')+'"><div><b>Caixa de passeios</b><span>Aberto por '+esc(x.por)+' às '+x.ab+(x.st==='aberto'?'':' · fechado '+esc(x.fech)+(dif!=null?' · contado '+brl(x.contado)+(Math.abs(dif)<.01?' · sem diferença':' · diferença '+(dif>0?'+':'')+brl(dif)):''))+'</span></div>'+(x.st==='aberto'?'<div class="btns"><button class="btn" id="pxTroco">+ Adicionar troco</button><button class="btn" id="pxSang">Sangria</button><button class="btn pri" id="pxFechar">Fechar caixa de passeios</button></div>':'<span class="pill p-free">Fechado</span>')+'</div>'}
  // formas de pagamento e movimentos
  var b='<div class="tw"><table><tbody>'+(Object.keys(r.pag).length?Object.keys(r.pag).sort().map(function(f){return '<tr><td>'+esc(f)+(f==='Online (site)'?'<div class="muted" style="font-size:12px">Pagos no site, de quem veio nos passeios finalizados</div>':'')+'</td><td class="r num">'+brl(r.pag[f])+'</td></tr>'}).join(''):'<tr><td class="muted" style="text-align:center;padding:16px">Nenhum passeio finalizado ainda.</td></tr>')+(r.rec?'<tr class="tot"><td>Receita dos passeios</td><td class="r num">'+brl(r.rec)+'</td></tr>':'')+'</tbody></table></div>';
  if(x){b+='<div class="eyebrow" style="margin:6px 0 0">Dinheiro do caixa</div><div class="calc">'+x.fundos.map(function(f){return '<div class="ln"><span>Troco · '+esc(f.n)+'<small>'+f.h+'</small></span><b class="num">'+brl(f.v)+'</b></div>'}).join('')+'<div class="ln"><span>Recebido em dinheiro das escolas</span><b class="num">'+brl(r.din)+'</b></div>'+x.sangs.map(function(f){return '<div class="ln minus"><span>Sangria · '+esc(f.n)+'<small>'+f.h+(f.m?' · '+esc(f.m):'')+'</small></span><b class="num">− '+brl(f.v)+'</b></div>'}).join('')+(r.despDin?'<div class="ln minus"><span>Despesas pagas com o dinheiro do caixa</span><b class="num">− '+brl(r.despDin)+'</b></div>':'')+'<div class="ln big"><span>Deveria ter no caixa</span><b class="num">'+brl(r.esperado)+'</b></div></div>'}
  if(r.reemb)b+='<div class="notice warn"><span><b>Reembolsos a fazer:</b> '+brl(r.reemb)+' para quem pagou no site e não veio.</span></div>';
  h+=sec('px_pag','Pago por forma de pagamento','Site, Pix, transferência, boleto, cartão e dinheiro dos passeios finalizados.',b,'<span class="pill p-blue num">'+brl(r.rec)+'</span>');
  // despesas dos passeios
  var ds=x?x.desp:[];
  b='<div class="tw"><table><thead><tr><th>Descrição</th><th>Alocação</th><th>Passeio</th><th>Pago com</th><th class="r">Valor</th><th></th></tr></thead><tbody>'+(ds.length?ds.map(function(y,i){return '<tr><td>'+esc(y.d)+'<div class="muted" style="font-size:12px">'+esc(y.h||'')+'</div></td><td>'+esc(y.cat)+'</td><td>'+esc(y.pas)+'</td><td>'+esc(y.f)+'</td><td class="r num">'+brl(y.v)+'</td><td class="r">'+(x.st==='aberto'?'<button class="btn link" data-delpd="'+i+'">remover</button>':'')+'</td></tr>'}).join('')+'<tr class="tot"><td colspan="4">Total</td><td class="r num">'+brl(r.desp)+'</td><td></td></tr>':'<tr><td colspan="6" class="muted" style="text-align:center;padding:16px">Nenhuma despesa de passeio.</td></tr>')+'</tbody></table></div>';
  if(pxOpen(k))b+='<div class="grid g4" style="align-items:end"><label class="fld span2"><span>Descrição</span><input class="in" id="pdDesc" placeholder="Ex.: Lanche da monitoria"></label><label class="fld"><span>Alocação</span><select class="in" id="pdCat">'+PDCAT.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></label><label class="fld"><span>Passeio</span><select class="in" id="pdPas"><option>Todos os passeios</option>'+d.pas.map(function(p){return '<option>'+esc(p.cli)+'</option>'}).join('')+'</select></label><label class="fld"><span>Valor</span><div class="affix"><b>R$</b><input class="in num" id="pdVal" inputmode="decimal" placeholder="0,00"></div></label><label class="fld"><span>Pago com</span><select class="in" id="pdForma"><option>Dinheiro do caixa</option><option>Pix</option><option>Cartão da empresa</option></select></label><div class="fld"><button class="btn pri" id="pdAdd" style="justify-content:center;min-height:42px">Lançar despesa</button></div></div>';
  else if(pode)b+='<p class="hint" style="margin:0">Abra o caixa de passeios para lançar despesas.</p>';
  h+=sec('px_desp','Despesas dos passeios','Monitoria, alimentação, transporte, materiais. Entram no resultado do dia.',b,'<span class="pill p-free num">'+brl(r.desp)+'</span>');
  // passeios
  if(!d.pas.length)h+='<div class="notice"><span>Nenhum passeio agendado nesta data. Passeios são criados no cadastro do cliente, como hoje.</span></div>';
  else{h+='<div><div class="eyebrow" style="margin:6px 0 10px">Passeios do dia</div><div class="stack" style="gap:12px">';
    d.pas.forEach(function(p){var c=pcalc(p),pg=p.fech.st==='pago';
      var st=pg?'<span class="pill p-ok">Finalizado · recibo '+p.fech.recibo+'</span>':'<span class="pill p-run">A fechar</span>';
      h+='<button class="pcard" data-pas="'+p.id+'"><div><h3>'+esc(p.cli)+'</h3><div class="meta">Representante '+esc(p.rep)+' · '+esc(p.transp)+' · embarque '+esc(p.hora||'—')+'</div><div style="margin-top:8px">'+st+' <span class="pill p-blue num">'+(pg?brl(p.fech.total)+' no passeio':'a cobrar '+brl(c.cob))+'</span></div></div><div class="side-num"><b class="num">'+(contados(p)+contAc(p))+'</b><small>pessoas contadas · previsão '+p.prev+'</small></div><div class="vchips">'+p.v.map(vchip).join('')+'</div></button>'});
    h+='</div></div>'}
  h+='<div class="savebar"><span class="muted">O relatório dos passeios traz o caixa, cada passeio, as contagens, os reembolsos e as despesas.</span><div class="btns"><button class="btn pri" data-export="passeios">'+ICON.doc+'Exportar relatório dos passeios</button></div></div>';
  return h+'</div>';
}

/* ---------- página do passeio ---------- */
function vtab(p){
  var tc=totCat(p);S.vopen=S.vopen||{};
  var b='<div class="tw"><table class="vt2"><thead><tr><th>Veículo</th><th class="r">Pessoas previstas</th><th class="r">Vieram</th><th>Status</th><th>Contado por</th><th>Responsável</th><th class="r"><span class="sr">Detalhes</span></th></tr></thead><tbody>';
  p.v.forEach(function(v,i){var c=cnt(v),ok=v.st!=='livre',op=!!S.vopen[p.id+':'+i];
    var st=v.st==='ok'?'<span class="pill p-ok">Concluído</span>':v.st==='run'?'<span class="pill p-run">Contando</span>':'<span class="pill p-free">Aguardando</span>';
    b+='<tr class="'+(op?'vopen':'')+'"><td><b style="color:var(--ink);font-weight:600">'+v.tipo+' '+v.n+'</b>'+(v.extra?'<div class="muted" style="font-size:12px">A mais no dia · '+esc(v.addBy)+'</div>':'')+(v.st==='livre'?'<div><button class="btn link" data-delv="'+i+'">remover</button></div>':'')+'</td><td class="r"><input class="in num" data-vprev="'+i+'" type="number" min="0" value="'+v.prev+'" style="max-width:80px;margin-left:auto;text-align:right;min-height:34px;padding:5px 9px" aria-label="Pessoas previstas '+v.tipo+' '+v.n+'"></td><td class="r num"><b style="color:var(--ink)">'+(ok?v.al+v.ac:'—')+'</b></td><td>'+st+'</td><td>'+esc(v.por||'—')+'</td><td>'+(v.resp?'<b style="color:var(--ink);font-weight:600;white-space:nowrap">'+esc(v.resp.n)+'</b><div class="muted num" style="font-size:12px;white-space:nowrap">'+esc(v.resp.tel)+'</div><button class="btn link" data-vdet="'+i+'">Ver assinatura</button>':'<span class="muted">—</span>')+'</td><td class="r">'+(ok?'<button class="vexp" data-vexp="'+i+'" aria-expanded="'+op+'" aria-label="'+(op?'Fechar':'Abrir')+' contagem do '+v.tipo+' '+v.n+'"><span class="chev" aria-hidden="true"></span></button>':'')+'</td></tr>';
    if(ok&&op){b+='<tr class="vdrow"><td colspan="7"><div class="vdgrid">'+MODS.map(function(m){return '<div class="modc"><b>'+m[0]+'</b>'+m[1].map(function(k){var ds=(k==='pcdCr'||k==='pcdAd')?pcdTxt(v,k):'';return '<div class="ln"><span>'+catN(k,p)+(CATS[k].s?' <em>'+CATS[k].s+'</em>':'')+(ds?'<small>'+esc(ds)+'</small>':'')+'</span><b class="num">'+c[k]+'</b></div>'}).join('')+'</div>'}).join('')+'</div>'+(v.obs?'<div class="restr2" style="margin-top:10px"><b>Observações</b><span>'+esc(v.obs)+'</span></div>':'')+'</td></tr>'}
  });
  b+='<tr class="tot"><td>Total</td><td class="r num">'+p.v.reduce(function(a,v){return a+v.prev},0)+'</td><td class="r num">'+(contados(p)+contAc(p))+'</td><td colspan="4"></td></tr></tbody></table></div>';
  b+='<div class="eyebrow" style="margin:6px 0 0">Contagem completa do passeio</div><div class="modgrid">'+MODS.map(function(m){return '<div class="modc"><b>'+m[0]+'</b>'+m[1].map(function(k){var ds=k==='pcdCr'||k==='pcdAd'?p.v.map(function(v){return v.st==='ok'?pcdTxt(v,k):''}).filter(Boolean).join(', '):'';return '<div class="ln"><span>'+catN(k,p)+(CATS[k].s?' <em>'+CATS[k].s+'</em>':'')+(ds?'<small>'+esc(ds)+'</small>':'')+'</span><b class="num">'+tc[k]+'</b></div>'}).join('')+'</div>'}).join('')+'</div>';
  var obs=p.v.filter(function(v){return v.st==='ok'&&v.obs});
  if(obs.length)b+='<div class="restr2"><b>Observações da contagem</b>'+obs.map(function(v){return '<span>'+v.tipo+' '+v.n+': '+esc(v.obs)+'</span>'}).join('')+'</div>';
  b+='<div class="btns"><button class="btn" data-addv="Ônibus">+ Ônibus</button><button class="btn" data-addv="Van">+ Van</button><span class="hint" style="margin:0">Chegou um veículo a mais no dia? A equipe também adiciona pelo app.</span></div>';
  return b;
}
function siteLista(p){
  if(!p.pres.length)return '<p class="muted" style="margin:0">Ninguém deste passeio comprou pelo site.</p>';
  var tot=p.pres.reduce(function(a,x){return a+x.v},0);
  var b='<div class="notice"><span>Quem comprou no site já entra como presente. Se alguém não veio, selecione no fechamento do passeio em <b>pessoas do site que precisam de reembolso</b>.</span></div>';
  b+='<div class="presbar"><input class="in" id="pq" type="search" placeholder="Buscar pelo nome" value="'+esc(S.pq||'')+'" aria-label="Buscar pessoa"><span class="muted num" style="font-size:13px">'+plural(p.pres.length,'pessoa','pessoas')+' · '+brl(tot)+' pagos no site</span></div>';
  b+='<div class="slist">'+p.pres.map(function(x,j){return {x:x,j:j}}).sort(function(a,c){return a.x.nome.localeCompare(c.x.nome,'pt-BR')}).map(function(o){var x=o.x,rb=p.reemb.indexOf(o.j)>=0;return '<div class="prow'+(rb?' rb':'')+'" data-pn="'+esc(x.nome.toLowerCase())+'"><span class="pnm"><b>'+esc(x.nome)+'</b><small>'+x.t+(rb?' · <span class="rbtag">Não veio · reembolso</span>':' · presente')+'</small></span><a class="lk num" data-cidlink="'+x.compra+'">'+x.compra+'</a><b class="num pv">'+brl(x.v)+'</b></div>'}).join('')+'</div>';
  return b;
}
function passeio(){
  var p=PASS[S.pid],k=p.date,pago=p.fech.st==='pago',vok=p.v.filter(function(v){return v.st==='ok'}).length,c=pago?p.fech.c:pcalc(p);
  S.date=k;if(S.fpFor!==p.id){S.fpFor=p.id;S.fpags=[{f:'Pix',v:null}]}
  var h=crumbsDia('<i>/</i><a data-tab-go="passeios">Passeios</a><i>/</i><span>'+esc(p.cli)+'</span>');
  h+='<div class="stack"><div class="card"><div class="h-row"><div><div class="eyebrow">Passeio · '+fmtY(k)+'</div><div class="title">'+esc(p.cli)+'</div><p class="sub">Representante '+esc(p.rep)+' · previsão de '+p.prev+' pessoas · '+(contados(p)+contAc(p))+' contadas no app</p></div>'+(pago?'<span class="pill p-ok"><span class="dot"></span>Finalizado · recibo '+p.fech.recibo+'</span>':'<span class="pill p-run"><span class="dot"></span>Fechamento aberto</span>')+'</div><p class="hint" style="margin:10px 0 0">Toque numa seção para abrir e editar.</p></div>';
  var b='<div class="grid g4"><label class="fld"><span>Cliente</span><input class="in" readonly value="'+esc(p.cli)+'"></label><label class="fld"><span>Representante</span><input class="in" readonly value="'+esc(p.rep)+'"><small>Vem do cadastro do cliente</small></label><label class="fld"><span>Pessoas previstas</span><input class="in num" id="pPrev" type="number" min="0" value="'+p.prev+'"></label><label class="fld"><span>Valor por pessoa no site</span><input class="in num" readonly value="'+brl(p.valor0)+'"><small>O que pagou quem comprou no site</small></label><label class="fld span2"><span>Transportador</span><input class="in" id="pTransp" list="tl" value="'+esc(p.transp)+'"><datalist id="tl"><option value="Jhonny"><option value="Juninho"><option value="Coca"><option value="Transporte do cliente"></datalist></label><label class="fld"><span>Telefone do transportador</span><input class="in" id="pTel" value="'+esc(p.tel)+'" placeholder="(11) 9...."></label><label class="fld"><span>Horário de embarque</span><input class="in" id="pHora" type="time" value="'+esc(p.hora)+'"></label><label class="fld" style="grid-column:1/-1"><span>Observações</span><textarea class="in" id="pObs" placeholder="Sem alimentação, só vans, chegada em horário diferente...">'+esc(p.obs)+'</textarea></label></div><div class="btns"><button class="btn pri" id="pSave">Salvar dados</button></div>';
  h+=sec('dados','Dados do passeio',esc(p.transp)+(p.tel?' · '+esc(p.tel):'')+(p.hora?' · embarque '+esc(p.hora):'')+' · '+p.prev+' pessoas previstas',b);
  h+=sec('veic','Veículos e contagem',(contados(p)+contAc(p))+' pessoas contadas · '+p.v.filter(function(v){return v.resp}).length+' responsáveis assinaram',vtab(p),'<span class="pill '+(vok===p.v.length?'p-ok':'p-run')+'">'+vok+' de '+p.v.length+' contados</span>');
  h+=sec('pres','Lista de presença · pagos no site','Vem completa: todos que compraram no site contam como presentes.',siteLista(p),'<span class="pill p-blue">'+presentes(p)+' de '+p.pres.length+' presentes</span>');
  // fechamento
  h+='<div class="fs"><div class="fs-h"><div><h3 class="h3">Fechamento do passeio</h3><p>Os valores por adulto e por criança valem só para quem foi contado no app e não pagou no site.</p></div></div><div class="fs-b">';
  if(vok<p.v.length&&!pago)h+='<div class="notice warn"><span>A contagem ainda não terminou: '+vok+' de '+p.v.length+' veículos. O cálculo usa o que foi contado até agora.</span></div>';
  if(!pago&&c.sAd+c.sCr>c.cAd+c.cCr)h+='<div class="notice warn"><span>Tem mais gente paga no site ('+(c.sAd+c.sCr)+') do que adultos e crianças contados no app ('+(c.cAd+c.cCr)+'). Confira a contagem ou selecione abaixo quem não veio para reembolso.</span></div>';
  var inp=function(id,val,lab){return pago?'<b class="num">'+brl(val)+'</b>':'<div class="affix" style="max-width:150px"><b>R$</b><input class="in num" id="'+id+'" inputmode="decimal" value="'+m2(val)+'" aria-label="'+lab+'"></div>'};
  var ninp=function(id,val,lab){return pago?'<b class="num">'+val+'</b>':'<input class="in num" id="'+id+'" type="number" min="0" value="'+val+'" style="width:76px;text-align:right" aria-label="'+lab+'">'};
  h+='<div class="fgrid"><div class="fcard"><small>Valor por adulto</small>'+inp('fVAd',c.vAd,'Valor por adulto')+'<span>'+(c.vAd!==p.valor0?'Site: '+brl(p.valor0)+'. Não muda o que já foi pago.':'Igual ao site. Pode ajustar.')+'</span></div><div class="fcard"><small>Valor por criança</small>'+inp('fVCr',c.vCr,'Valor por criança')+'<span>'+(c.vCr!==p.valor0?'Site: '+brl(p.valor0)+'. Não muda o que já foi pago.':'Igual ao site. Pode ajustar.')+'</span></div><div class="fcard"><small>Cortesias adulto</small>'+ninp('fCAd',c.cortAd,'Cortesias adulto')+'<span>não cobradas</span></div><div class="fcard"><small>Cortesias criança</small>'+ninp('fCCr',c.cortCr,'Cortesias criança')+'<span>não cobradas</span></div></div>';

  if(t.id==='pxFecharOk'){var x9=PCX[S.date];x9.contado=money($('#pxC').value)||0;x9.st='fechado';x9.fech=fmt(S.date)+' '+agora();closeModal();render();toast('Caixa de passeios fechado');return}
  if(t.id==='pdAdd'){var pv=money($('#pdVal').value),pdd=$('#pdDesc').value.trim(),pf9=$('#pdForma').value;if(!pdd||!pv){toast('Preencha a descrição e o valor da despesa');return}if(pf9==='Dinheiro do caixa'&&pv>pcxCalc(S.date).esperado+.004){toast('Não tem esse dinheiro no caixa de passeios');return}PCX[S.date].desp.push({d:pdd,cat:$('#pdCat').value,pas:$('#pdPas').value,v:pv,f:pf9,h:agora()});render();toast('Despesa de passeio lançada: '+brl(pv));return}
  if((el=t.closest('[data-delpd]'))){PCX[S.date].desp.splice(+el.dataset.delpd,1);render();return}
  if((el=t.closest('[data-closetoast]'))){closeModal();toast(el.dataset.closetoast);return}
  // config
  if(t.id==='cfSave'){var ing2=$$('[data-g="ing"]:checked').map(function(x){return x.value}),it2=$$('[data-g="it"]:checked').map(function(x){return x.value});
    if(!ing2.length){var er=$('#cfErr');er.textContent='Escolha ao menos um ingresso para vender.';er.hidden=false;return}
    var k2=S.cfg.date;if(!DATES[k2])DATES[k2]={du:null,pas:[],fech:{st:'aberto'}};
    var tb2=($('input[name="cfTab"]:checked')||{}).value||'padrao';TABD[k2]=tb2;DATES[k2].du={ing:ing2,it:it2,val:$('#cfVal').value,cap:+$('#cfCap').value||0,status:$('#cfSt').value,tab:tb2};
    var nova=S.cfg.mode==='new';S.hist=[{scr:'agenda'}];S.scr='dia';S.date=k2;S.tab='resumo';render(true);toast(nova?'Day use aberto em '+fmt(k2)+'. Já aparece no site.':'Day use atualizado');return}
});
document.addEventListener('input',function(e){

  if(e.target.id==='cq'){S.q=e.target.value;var pos=e.target.selectionStart;render();var n=$('#cq');n.focus();n.setSelectionRange(pos,pos)}

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.name==='cfTab'){S.cfg.tab=el.value;S.cfg.ing=$$('[data-g="ing"]:checked').map(function(x){return x.value});S.cfg.it=$$('[data-g="it"]:checked').map(function(x){return x.value});render();return}
  if(el.id==='selTab')return;
  if(el.dataset.fpf!=null){S.fpags[+el.dataset.fpf].f=el.value;render();return}

  if(el.id==='fVAd'||el.id==='fVCr'){var pz=PASS[S.pid],nv=money(el.value);if(nv!=null&&nv>=0){pz[el.id==='fVAd'?'vAd':'vCr']=nv;S.fpags=[{f:S.fpags[0].f,v:null}];render();toast('Valor por '+(el.id==='fVAd'?'adulto':'criança')+': '+brl(nv)+'. Só vale para quem não pagou no site.')}return}
  if(el.id==='fCAd'||el.id==='fCCr'){var pc=PASS[S.pid];pc[el.id==='fCAd'?'cortAd':'cortCr']=Math.max(0,parseInt(el.value,10)||0);S.fpags=[{f:S.fpags[0].f,v:null}];render();return}
  if(el.id==='fCortX'){var pc2=PASS[S.pid],nc=Math.max(0,parseInt(el.value,10)||0);pc2.cortAj=nc;pc2.cortPor=ME;S.fpags=[{f:S.fpags[0].f,v:null}];render();toast(plural(nc,'cortesia','cortesias')+' no fechamento');return}
  if(el.id==='fValorX'){var pz=PASS[S.pid],nv2=money(el.value);if(nv2!=null&&nv2>=0&&nv2!==pz.valor){pz.valor=nv2;pz.valorPor=ME;S.fpags=[{f:S.fpags[0].f,v:null}];render();toast('Valor por aluno ajustado para '+brl(nv2))}return}
  if(el.dataset.vprev!=null){PASS[S.pid].v[+el.dataset.vprev].prev=+el.value||0;render();return}
  if(el.dataset.li!=null){S.venda.ings[+el.dataset.li][el.dataset.f]=el.value;resetPag();render();return}
  if(el.dataset.ti!=null){S.venda.its[+el.dataset.ti].k=el.value;resetPag();render();return}
  if(el.dataset.pf!=null){S.venda.pags[+el.dataset.pf].f=el.value;render();return}
  if(el.dataset.pv!=null){S.venda.pags[+el.dataset.pv].v=money(el.value)||0;render();return}
  if(el.id==='cxCont'){cxById(S.cxid).contado=money(el.value);render();return}
});
