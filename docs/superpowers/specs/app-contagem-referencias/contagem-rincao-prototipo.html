<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Contagem Rincão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular do Rincão. No computador aparece dentro de um aparelho; no celular ocupa a tela toda. Cinza = livre, amarelo = contando, verde = concluído. */
:root{
  --desk:#DFE6EF; --bg:#F4F7FB; --card:#FFFFFF; --line:#D9E3EE; --head:#EAF2FB;
  --navy:#133A62; --blue:#2F6FB2; --ink:#0F2D52; --text:#2E3F55; --muted:#6A7C92;
  --free:#E6ECF3; --free-ink:#5C6F86; --free-line:#CBD6E3;
  --run:#FFF1CF; --run-ink:#8A5A00; --run-line:#F2B33D; --run-solid:#F2B33D;
  --ok:#E3F4E9; --ok-ink:#1F7440; --ok-line:#58B57A; --ok-solid:#2E8B4E;
  --bad:#FCE7E5; --bad-ink:#B3362C;
  --frame:#0B1F36;
  --font:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0A1420; --bg:#0F1A28; --card:#16243A; --line:#28405E; --head:#1B2F4A;
    --navy:#0D2440; --blue:#6FA9E3; --ink:#EAF2FB; --text:#C9D6E4; --muted:#8FA3BB;
    --free:#1C2C42; --free-ink:#9CB0C7; --free-line:#2E4664;
    --run:#3A2E12; --run-ink:#F2C766; --run-line:#B98A22; --run-solid:#E8A92E;
    --ok:#143225; --ok-ink:#6FD39A; --ok-line:#2F7D50; --ok-solid:#2F8F55;
    --bad:#3A1A18; --bad-ink:#F2877C; --frame:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0A1420; --bg:#0F1A28; --card:#16243A; --line:#28405E; --head:#1B2F4A;
  --navy:#0D2440; --blue:#6FA9E3; --ink:#EAF2FB; --text:#C9D6E4; --muted:#8FA3BB;
  --free:#1C2C42; --free-ink:#9CB0C7; --free-line:#2E4664;
  --run:#3A2E12; --run-ink:#F2C766; --run-line:#B98A22; --run-solid:#E8A92E;
  --ok:#143225; --ok-ink:#6FD39A; --ok-line:#2F7D50; --ok-solid:#2F8F55;
  --bad:#3A1A18; --bad-ink:#F2877C; --frame:#000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-block:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;color:var(--ink);line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.caption{font-size:12.5px;color:var(--muted);text-align:center;max-width:400px;padding-inline:16px}

.device{position:relative;width:100%;max-width:400px;height:min(860px,calc(100% - 60px));min-height:600px;border:10px solid var(--frame);border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(11,31,54,.25)}
@media (max-width:520px){
  body{padding-block:0;gap:0}
  .caption{display:none}
  .device{max-width:none;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.bar{background:var(--navy);color:#fff;padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:12px;flex:none}
.bar .bk{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;flex:none}
.bar .bk svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}
.bar .tt{flex:1;min-width:0}
.bar .tt b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.bar .tt small{display:block;font-size:12px;color:#B9CCE2}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#DCE7F3}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.me1{background:#8FB9E3;color:#0B1F36}
.brandmark{font-weight:800;letter-spacing:.06em;font-size:15px;color:#E7B864}
.brandmark small{display:block;font-size:9.5px;letter-spacing:.14em;color:#B9CCE2;font-weight:600}

/* faixa de dias */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:12px;padding-bottom:12px;background:var(--navy);flex:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:58px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;padding:7px 0 8px;text-align:center;cursor:pointer}
.dchip span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#B9CCE2}
.dchip b{display:block;font-size:19px;font-weight:700}
.dchip i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.dchip.has i{background:#8FB9E3}
.dchip.on{background:#fff;color:var(--frame);border-color:#fff}
.dchip.on span{color:#47617F}
.dchip.on b{color:#0B1F36}
.dchip.on.has i{background:#2F6FB2}

.scroll{flex:1;overflow-y:auto;padding-top:16px;padding-bottom:110px}
.sec{margin-top:22px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec-h a,.sec-h button.lk{font-size:13px;color:var(--blue);font-weight:600;background:none;border:0;padding:0;cursor:pointer}

/* resumo */
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sum-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.sum .big{font-size:40px;font-weight:800;color:var(--ink);line-height:1}
.sum .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.sum .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
.progress{height:10px;border-radius:99px;background:var(--free);overflow:hidden;display:flex;margin-top:14px}
.progress i{display:block;height:100%}
.progress .p-ok{background:var(--ok-solid)}
.progress .p-run{background:var(--run-solid)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

/* day use */
.du{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;text-align:left;cursor:pointer}
.du .ic{width:46px;height:46px;border-radius:12px;background:var(--head);display:grid;place-items:center;flex:none}
.du .ic svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:2}
.du b{display:block;color:var(--ink);font-size:15.5px}
.du small{display:block;color:var(--muted);font-size:13px}
.du .go{margin-left:auto;font-size:13px;font-weight:600;color:#fff;background:var(--blue);border-radius:10px;padding:8px 12px;flex:none}

/* passeios */
.pas{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px}
.pas-h{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:left}
.pas-h b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.pas-h small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.pas-h .cnt{text-align:right;flex:none}
.pas-h .cnt b{font-size:18px}
.pas-h .cnt small{margin-top:0}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.veh{border-radius:12px;border:1.5px solid var(--free-line);background:var(--free);color:var(--free-ink);padding:10px 11px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;min-height:74px}
.veh .vt{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:inherit}
.veh .vt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.veh .vs{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh .vn{font-size:12px;font-weight:600}
.veh.run{background:var(--run);border-color:var(--run-line);color:var(--run-ink)}
.veh.ok{background:var(--ok);border-color:var(--ok-line);color:var(--ok-ink)}
.veh.mine{box-shadow:0 0 0 2px var(--blue)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--run-solid);display:inline-block;margin-left:auto;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.addv{border:1.5px dashed var(--line);background:transparent;color:var(--blue);font-weight:600;font-size:13px;border-radius:12px;min-height:74px;cursor:pointer}

.notice{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--head);border:1px solid var(--line);color:var(--text);margin-bottom:12px}
.notice.ok{background:var(--ok);border-color:var(--ok-line);color:var(--ok-ink)}
.notice.run{background:var(--run);border-color:var(--run-line);color:var(--run-ink)}

/* rodapé fixo */
.foot{position:absolute;left:0;right:0;bottom:0;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:15.5px;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}
.btn.green{background:var(--ok-solid);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--bad-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* contagem */
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vhead .ic{width:52px;height:52px;border-radius:14px;background:var(--run);border:1.5px solid var(--run-line);display:grid;place-items:center;color:var(--run-ink)}
.vhead .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2}
.vhead b{display:block;font-size:20px;color:var(--ink)}
.vhead small{display:block;color:var(--muted);font-size:13px}
.counter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.counter .cl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.counter .cv{font-size:72px;font-weight:800;color:var(--ink);text-align:center;line-height:1;margin:10px 0 14px}
.counter.sm .cv{font-size:40px;margin:6px 0 10px}
.ctrls{display:grid;grid-template-columns:64px 1fr;gap:10px}
.ctrls button{border:0;border-radius:14px;font-size:26px;font-weight:700;cursor:pointer;height:72px}
.counter.sm .ctrls button{height:52px;font-size:22px}
.ctrls .minus{background:var(--free);color:var(--free-ink)}
.ctrls .plus{background:var(--blue);color:#fff}
.ctrls .plus:active{filter:brightness(.92)}
.bar-prev{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
textarea.in,input.in,select.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink)}
textarea.in{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:12px}
label.f .in{margin-top:6px;display:block}

/* leitor QR */
.cam{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1;max-width:100%;background:#0B1F36;display:grid;place-items:center}
.cam .frame{width:62%;aspect-ratio:1/1;border-radius:18px;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .scan{position:absolute;left:19%;right:19%;height:2px;background:#8FB9E3;top:30%;animation:sc 2.2s ease-in-out infinite}
@keyframes sc{0%,100%{top:24%}50%{top:74%}}
@media (prefers-reduced-motion:reduce){.cam .scan{animation:none}}
.cam p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#DCE7F3;font-size:13px;margin:0}
.res{border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:center}
.res.ok{background:var(--ok);border:1px solid var(--ok-line);color:var(--ok-ink)}
.res.bad{background:var(--bad);border:1px solid var(--bad-ink);color:var(--bad-ink)}
.res b{display:block;font-size:17px}
.res small{display:block;font-size:13px;opacity:.9}
.res .big{font-size:30px;font-weight:800;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kpi b{display:block;font-size:22px;color:var(--ink);font-weight:700}
.kpi small{font-size:11.5px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .dot{width:9px;height:9px;border-radius:50%;flex:none}
.feed time{margin-left:auto;color:var(--muted);font-size:12px}

/* relatório */
.rep{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rep-h{background:var(--navy);color:#fff;padding:16px 18px}
.rep-h small{display:block;font-size:11px;letter-spacing:.14em;color:#B9CCE2;font-weight:600;text-transform:uppercase}
.rep-h b{display:block;font-size:19px;margin-top:2px;color:#fff}
.rep-tot{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.rep-tot div{padding:14px 10px;text-align:center;border-right:1px solid var(--line)}
.rep-tot div:last-child{border-right:0}
.rep-tot b{display:block;font-size:24px;color:var(--ink);font-weight:800}
.rep-tot small{font-size:11.5px;color:var(--muted)}
.rep-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.rep-sec:last-child{border-bottom:0}
.rep-sec h3{font-size:15px}
.rep-sec .meta{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.rep-line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.rep-line span{color:var(--muted)}
.rep-line b{color:var(--ink);font-weight:600;text-align:right}

/* folha inferior */
.sheet-bg{position:absolute;inset:0;background:rgba(8,20,36,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
.sheet .btn{margin-top:10px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text);background:none;border:0;cursor:pointer;padding:0}
.app i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--blue);background:var(--head);color:var(--blue)}

.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;z-index:30;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* login */
.scroll.lgv{background:var(--navy);padding-bottom:24px;display:flex;flex-direction:column}
.login{display:flex;flex-direction:column;gap:22px;min-height:100%;justify-content:center;padding-block:24px}
.lg-brand{text-align:center}
.lg-logo{font-weight:800;font-size:44px;letter-spacing:.04em;color:#E7B864;text-shadow:2px 2px 0 #7A4B12}
.lg-brand small{display:block;color:#B9CCE2;font-size:11px;letter-spacing:.2em;font-weight:600;margin-top:4px}
.lg-card{background:var(--card);border-radius:20px;padding:22px 18px 16px;display:grid;gap:2px}
.lg-card h2{font-size:22px}
.lg-card p{margin:2px 0 16px;color:var(--muted);font-size:14px}
.lg-card .btn{margin-top:6px}
.btn.ghost2{background:transparent;color:var(--blue);font-weight:600;font-size:14px;padding:10px}
.lg-err{background:var(--bad);color:var(--bad-ink);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:6px}
.lg-demo{color:#B9CCE2;font-size:12.5px;text-align:center;margin:0}
.lg-demo b{color:#fff}
button.me{background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:4px 4px 4px 12px;cursor:pointer;color:#DCE7F3;display:flex;align-items:center;gap:8px;font-size:12.5px}
.avbtn{border:0;cursor:pointer}
.acct{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.av.big{width:52px;height:52px;font-size:18px}
.xtra{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px}
.veh.run .xtra,.veh.ok .xtra{background:currentColor;color:var(--card)}
.xinfo{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--head);border-radius:999px;padding:2px 9px}
.addv{min-height:74px}
.brandmark img{height:42px;width:auto;display:block}
.lg-img{width:220px;max-width:70%;height:auto;display:block;margin:0 auto}
.ctot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.ctot div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ctot span{display:block;font-size:44px;font-weight:800;color:var(--ink);line-height:1}
.ctot small{font-size:12.5px;color:var(--muted)}
.ctiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{position:relative}
.ct-add{width:100%;min-height:92px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.ct-add b{font-size:15px;padding-right:30px;line-height:1.25}
.ct-add span{font-size:30px;font-weight:800;line-height:1.1}
.ct-add i{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center;font-size:18px}
.ctile.al .ct-add{min-height:110px}
.ctile.on .ct-add{border-color:var(--blue);background:var(--head)}
.ct-add:active{transform:scale(.98)}

function texto(){
